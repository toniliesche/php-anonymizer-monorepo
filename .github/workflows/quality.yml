name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PHP_VERSION: '8.5'
      XDEBUG_MODE: coverage
      CI_EVENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CI_MAIN_BASELINE_REF: origin/${{ github.base_ref || 'main' }}
      CI_DIAGNOSTICS_DIR: var/ci-diagnostics/${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xdebug
          coverage: xdebug
      - name: Install git-subtree
        run: sh tools/install-git-subtree.sh
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run full QA
        run: composer ci:run-gate quality composer qa
      - name: Record workflow outcome
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CI_DIAGNOSTICS_DIR"
          printf 'event=%s\nrevision=%s\nrun_id=%s\nattempt=%s\noutcome=%s\n' \
            "$GITHUB_EVENT_NAME" "$CI_EVENT_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CI_JOB_STATUS" \
            > "$CI_DIAGNOSTICS_DIR/workflow-metadata.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_DIAGNOSTICS_DIR }}/
          if-no-files-found: error
