deptrac:
  paths:
    - packages/anonymizer/src
    - packages/anonymizer-bundle/src
  exclude_files: ~
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Domain\\\\.*#"
    - name: Application
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Application\\\\.*#"
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Infrastructure\\\\.*#"
    - name: SymfonyBundle
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerBundle\\\\.*#"
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
    SymfonyBundle:
      - Application
      - Domain
