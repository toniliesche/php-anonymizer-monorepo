deptrac:
  paths:
    - packages/anonymizer/src
    - packages/anonymizer-bundle/src
    - packages/anonymizer-faker/src
    - packages/anonymizer-personas/src
    - packages/anonymizer-pseudonymization/src
    - packages/anonymizer-symfony-serializer/src
  exclude_files: ~
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Domain\\\\.*#"
    - name: Application
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Application\\\\.*#"
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Infrastructure\\\\.*#"
    - name: SymfonyBundle
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerBundle\\\\.*#"
    - name: FakerIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerFaker\\\\.*#"
    - name: PersonasIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerPersonas\\\\.*#"
    - name: PseudonymizationIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerPseudonymization\\\\.*#"
    - name: SerializerIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerSymfonySerializer\\\\.*#"
    - name: Symfony
      collectors:
        - type: classNameRegex
          value: "#^Symfony\\\\.*#"
    - name: Faker
      collectors:
        - type: classNameRegex
          value: "#^Faker\\\\.*#"
    - name: Psr
      collectors:
        - type: classNameRegex
          value: "#^Psr\\\\.*#"
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
    SymfonyBundle:
      - Application
      - Domain
      - FakerIntegration
      - PersonasIntegration
      - PseudonymizationIntegration
      - SerializerIntegration
      - Symfony
      - Psr
    FakerIntegration:
      - Application
      - Domain
      - Faker
    PersonasIntegration:
      - Application
      - Domain
    PseudonymizationIntegration:
      - Application
      - Domain
    SerializerIntegration:
      - Application
      - Domain
      - Symfony
