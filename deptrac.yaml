deptrac:
  paths:
    - packages/anonymizer/src
    - packages/anonymizer-bundle/src
    - packages/anonymizer-faker/src
    - packages/anonymizer-personas/src
  exclude_files: ~
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Domain\\\\.*#"
    - name: Application
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Application\\\\.*#"
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Infrastructure\\\\.*#"
    - name: SymfonyBundle
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerBundle\\\\.*#"
    - name: FakerIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerFaker\\\\.*#"
    - name: PersonasIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerPersonas\\\\.*#"
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
    SymfonyBundle:
      - Application
      - Domain
    FakerIntegration:
      - Application
      - Domain
    PersonasIntegration:
      - Application
      - Domain
