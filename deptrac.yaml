deptrac:
  paths:
    - packages/anonymizer/src
    - packages/anonymizer-bundle/src
    - packages/anonymizer-faker/src
    - packages/anonymizer-laravel/src
    - packages/anonymizer-personas/src
    - packages/anonymizer-pseudonymization/src
    - packages/anonymizer-symfony-serializer/src
  exclude_files: ~
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Domain\\\\.*#"
    - name: Application
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Application\\\\.*#"
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\Anonymizer\\\\Infrastructure\\\\.*#"
    - name: SymfonyBundle
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerBundle\\\\.*#"
    - name: FakerIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerFaker\\\\.*#"
    - name: PersonasIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerPersonas\\\\.*#"
    - name: PseudonymizationIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerPseudonymization\\\\.*#"
    - name: SerializerIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerSymfonySerializer\\\\.*#"
    - name: LaravelIntegration
      collectors:
        - type: classNameRegex
          value: "#^PhpAnonymizer\\\\AnonymizerLaravel\\\\.*#"
    - name: Symfony
      collectors:
        - type: classNameRegex
          value: "#^Symfony\\\\.*#"
    - name: Faker
      collectors:
        - type: classNameRegex
          value: "#^Faker\\\\.*#"
    - name: Psr
      collectors:
        - type: classNameRegex
          value: "#^Psr\\\\.*#"
    - name: Laravel
      collectors:
        - type: classNameRegex
          value: "#^Illuminate\\\\.*#"
    - name: WebmozartAssert
      collectors:
        - type: classNameRegex
          value: "#^Webmozart\\\\Assert\\\\.*#"
  ruleset:
    Domain:
      - WebmozartAssert
    Application:
      - Domain
      - WebmozartAssert
    Infrastructure:
      - Application
      - Domain
      - WebmozartAssert
    SymfonyBundle:
      - Application
      - Domain
      - FakerIntegration
      - PersonasIntegration
      - PseudonymizationIntegration
      - SerializerIntegration
      - Symfony
      - Psr
      - WebmozartAssert
    FakerIntegration:
      - Application
      - Domain
      - Faker
      - WebmozartAssert
    PersonasIntegration:
      - Application
      - Domain
      - WebmozartAssert
    PseudonymizationIntegration:
      - Application
      - Domain
      - WebmozartAssert
    SerializerIntegration:
      - Application
      - Domain
      - Symfony
      - WebmozartAssert
    LaravelIntegration:
      - Application
      - Domain
      - FakerIntegration
      - PersonasIntegration
      - PseudonymizationIntegration
      - SerializerIntegration
      - Symfony
      - Psr
      - Laravel
      - WebmozartAssert
